name: blackfox_config_builder
description: Black Fox Config Builder — Android MVP for 3X-UI panel config management.
publish_to: "none"
version: 1.1.3+8

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  dio: ^5.7.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/logo.jpg
    - assets/images/github-mark.png
